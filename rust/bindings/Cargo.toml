[package]
name = "vlm-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings exposing nanochat-VLM Rust components to Python (module: nanochat_vlm_rs)"

[lib]
name = "nanochat_vlm_rs"
crate-type = ["cdylib"]

[dependencies]
vlm-preprocessing = { path = "../preprocessing" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
numpy = "0.23"
anyhow = { workspace = true }
vlm-inference = { path = "../inference" }
vlm-data = { path = "../data" }
candle-core = { workspace = true }
serde_json = { workspace = true }
