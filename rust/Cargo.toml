[workspace]
resolver = "2"
members = ["preprocessing", "tokenizer", "data", "dataprep", "inference", "eval", "bindings", "cli", "server", "benchmarks", "wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
candle-core = "0.9"
candle-nn = "0.9"
fancy-regex = "0.16"
base64 = "0.22"
rand = "0.8"
ahash = "0.8"
dary_heap = "0.3"
compact_str = "0.9"
log = "0.4"
parquet = { version = "56", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
arrow-array = "56"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
